name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-cli:
    name: Test NPM CLI & Native Runner
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify NPM package metadata & tarball contents
        run: npm pack --dry-run

      - name: Test CLI help output
        run: node bin/aevoraseo.js --help

      - name: Test CLI version
        run: node bin/aevoraseo.js version

      - name: Run CLI doctor diagnostics
        run: node bin/aevoraseo.js doctor
        continue-on-error: true
