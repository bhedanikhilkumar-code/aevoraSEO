name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-python:
    name: Test Python Core Engine (${{ matrix.os }} - Py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,reports]"
          pip install playwright pytest
          playwright install chromium

      - name: Run release hygiene check
        run: python scripts/check_release.py

      - name: Run full pytest test suite
        run: pytest tests/ -v

  test-cli:
    name: Test NPM Wrapper & CLI (${{ matrix.os }} - Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Python for fallback runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python engine in editable mode
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .

      - name: Verify NPM package metadata & tarball contents
        run: npm pack --dry-run

      - name: Test CLI help output
        run: node bin/aevoraseo.js --help

      - name: Test CLI version
        run: node bin/aevoraseo.js version

      - name: Run CLI doctor diagnostics
        run: node bin/aevoraseo.js doctor
        continue-on-error: true
