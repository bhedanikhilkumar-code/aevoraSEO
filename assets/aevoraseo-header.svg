<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 132" width="100%" height="132" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="seoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark high-contrast background card -->
  <rect width="820" height="132" rx="12" fill="#0B0F19" stroke="#1E293B" stroke-width="1.5" />
  
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13.5" font-weight="900" letter-spacing="0.5">
    <!-- Line 1 -->
    <text x="65" y="30">
      <tspan fill="#F8FAFC"> █████╗ ███████╗██╗   ██╗ ██████╗ ██████╗  █████╗ </tspan>
      <tspan fill="url(#seoGrad)" filter="url(#glow)">    ███████╗███████╗ ██████╗ </tspan>
    </text>
    <!-- Line 2 -->
    <text x="65" y="48">
      <tspan fill="#F8FAFC">██╔══██╗██╔════╝██║   ██║██╔═══██╗██╔══██╗██╔══██╗</tspan>
      <tspan fill="url(#seoGrad)" filter="url(#glow)">    ██╔════╝██╔════╝██╔═══██╗</tspan>
    </text>
    <!-- Line 3 -->
